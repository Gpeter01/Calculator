<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>The Calculator</title>
</head>
<body>
    <div class="main-container">
        <div class="display-container">
            <div class="temp-result"><p class="para-result"></p></div>
            <div class="query"><p class="para-query"></p></div>
        </div>
        <div class="calculator-container">
            <div class="main-calculator">
                <div class="special">
                    <div class="delete"><p>&#9003</p></div>
                    <div class="refresh"><p>AC</p></div>
                    <div class="plus-or-minus"><p>&#177</p></div>
                </div>
                <div class="number-pad">
                    <div class="seven"><p>7</p></div>
                    <div class="eight"><p>8</p></div>
                    <div class="nine"><p>9</p></div>
                    <div class="four"><p>4</p></div>
                    <div class="five"><p>5</p></div>
                    <div class="six"><p>6</p></div>
                    <div class="one"><p>1</p></div>
                    <div class="two"><p>2</p></div>
                    <div class="three"><p>3</p></div>
                </div>
                <div class="key-feature">
                    <div class="zero"><p>0</p></div>
                    <div class="point"><p>.</p></div>
                </div>
            </div>
            <div class="calculator-operations">
                <div class="division"><p>÷</p></div>
                <div class="multiplication"><p>&#215</p></div>
                <div class="addition"><p>+</p></div>
                <div class="subtraction"><p>-</p></div>
                <div class="equal-to"><p>=</p></div>
            </div>
        </div>
    </div>
</body>
</html>
