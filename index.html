<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>The Calculator</title>
</head>
<body>
    <div class="main-container">
        <div class="display-container">
            <div class="temp-result"><p class="para-result"></p></div>
            <div class="query"><p class="para-query"></p></div>
        </div>
        <div class="calculator-container">
            <div class="main-calculator">
                <div class="special">
                    <div class="delete"><p class="delete">&#9003</p></div>
                    <div class="refresh"><p class="refresh">AC</p></div>
                    <div class="plus-or-minus"><p class="plus-or-minus">&#177</p></div>
                </div>
                <div class="operands">
                    <div class="number-pad">
                        <div class="seven"><p class="seven">7</p></div>
                        <div class="eight"><p class="eight">8</p></div>
                        <div class="nine"><p class="nine">9</p></div>
                        <div class="four"><p class="four">4</p></div>
                        <div class="five"><p class="five">5</p></div>
                        <div class="six"><p class="six">6</p></div>
                        <div class="one"><p class="one">1</p></div>
                        <div class="two"><p class="two">2</p></div>
                        <div class="three"><p class="three">3</p></div>
                    </div>
                    <div class="key-feature">
                        <div class="zero"><p class="zero">0</p></div>
                        <div class="point"><p class="point">.</p></div>
                    </div>
                </div>
            </div>
            <div class="calculator-operations">
                <div class="division"><p class="division">÷</p></div>
                <div class="multiplication"><p class="multiplication">&#215</p></div>
                <div class="addition"><p class="addition">+</p></div>
                <div class="subtraction"><p class="subtraction">-</p></div>
                <div class="equal-to"><p class="equal-to">=</p></div>
            </div>
        </div>
    </div>
</body>
</html>
